name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@revv'

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate API client
        run: npm run client:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (zero warnings)
        run: npm run lint -- --max-warnings 0

      - name: Test
        run: npm test

      - name: OpenAPI drift
        run: node tools/check-openapi-drift.mjs .

      - name: Foundation check
        run: node tools/verify-foundation.mjs .

      - name: Design-token check
        run: node tools/check-design-tokens.mjs .
